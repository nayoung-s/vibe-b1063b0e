<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>케어파인더 | 우리 동네 병원 찾기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
      <span class="brand-icon">✚</span>
      <span>케어파인더</span>
    </a>
    <span class="status"><span class="status-dot"></span>공공데이터 기반</span>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">LOCAL HOSPITAL FINDER</p>
      <h1>우리 동네 병원을<br /><strong>한눈에 찾아보세요.</strong></h1>
      <p>건강보험심사평가원 병원정보서비스를 바탕으로 지역 병원 정보를 조회합니다.</p>
    </section>

    <section class="search-card">
      <div class="notice">
        <span class="notice-icon">ⓘ</span>
        <div>
          <strong>인증키 없이 바로 검색할 수 있어요.</strong>
          <p>시·도를 선택하고 검색하세요. 병원명과 병원 종류는 필요한 경우에만 입력하면 됩니다.</p>
        </div>
      </div>

      <div class="filter-grid">
        <label>
          <span>시·도 <b>*</b></span>
          <select id="sidoFilter">
            <option value="110000">서울특별시</option>
            <option value="260000">부산광역시</option>
            <option value="270000">대구광역시</option>
            <option value="280000">인천광역시</option>
            <option value="290000">광주광역시</option>
            <option value="300000">대전광역시</option>
            <option value="310000">울산광역시</option>
            <option value="361100">세종특별자치시</option>
            <option value="410000">경기도</option>
            <option value="420000">강원특별자치도</option>
            <option value="430000">충청북도</option>
            <option value="440000">충청남도</option>
            <option value="450000">전북특별자치도</option>
            <option value="460000">전라남도</option>
            <option value="470000">경상북도</option>
            <option value="480000">경상남도</option>
            <option value="500000">제주특별자치도</option>
          </select>
        </label>

        <label>
          <span>시군구 코드 <em>(선택)</em></span>
          <input id="sgguFilter" type="text" inputmode="numeric" placeholder="모르면 비워두세요" />
        </label>

        <label>
          <span>병원 이름 <em>(선택)</em></span>
          <input id="hospitalNameFilter" type="text" placeholder="예: 서울병원" />
        </label>

        <label>
          <span>병원 종류 <em>(선택)</em></span>
          <select id="hospitalTypeFilter">
            <option value="">전체 병원 종류</option>
            <option value="01">상급종합병원</option>
            <option value="11">종합병원</option>
            <option value="21">병원</option>
            <option value="31">의원</option>
            <option value="41">치과병원</option>
            <option value="51">치과의원</option>
            <option value="71">보건소</option>
          </select>
        </label>
      </div>

      <div class="button-row">
        <button id="resetButton" class="secondary-button" type="button">조건 초기화</button>
        <button id="searchButton" class="primary-button" type="button">🔍 지역 병원 검색하기</button>
      </div>
    </section>

    <section class="result-section">
      <div class="result-header">
        <div>
          <p class="eyebrow">SEARCH RESULT</p>
          <h2 id="resultTitle">지역을 선택하고 검색해보세요</h2>
        </div>
        <span id="resultCount" class="count-badge">0곳</span>
      </div>

      <div id="messageBox" class="message-box">
        <strong>검색 안내</strong>
        <p>시·도를 선택한 후 지역 병원 검색하기 버튼을 눌러주세요.</p>
      </div>

      <div id="hospitalList" class="hospital-list"></div>
    </section>
  </main>

  <template id="hospitalTemplate">
    <article class="hospital-card">
      <div class="hospital-top">
        <div>
          <div class="name-row">
            <h3 class="hospital-name"></h3>
            <span class="hospital-type"></span>
          </div>
          <p class="hospital-address"></p>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <span>전화번호</span>
          <strong class="hospital-phone"></strong>
        </div>
        <div class="info-item">
          <span>병상 수</span>
          <strong class="hospital-beds"></strong>
        </div>
      </div>

      <div class="department-area">
        <span class="info-label">진료과목</span>
        <div class="department-tags"></div>
      </div>

      <div class="card-actions">
        <a class="map-link" target="_blank" rel="noopener noreferrer">지도에서 보기 ↗</a>
        <a class="call-link">전화하기</a>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
